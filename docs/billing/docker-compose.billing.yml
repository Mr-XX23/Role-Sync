# Append this service to backend/docker-compose.yml.
#
# It lives here because backend/.gitignore blanket-ignores docker-compose.yml, so
# the real compose file cannot be committed. Paste the block below in alongside
# the other services (before the top-level `volumes:` key).
#
# Note there is no `ports:` mapping. Port 8085 stays off the host on purpose: the
# service trusts the gateway-injected X-User-Id, which is only safe while the
# gateway is the sole way in. Publishing it would let anyone forge an identity.

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    env_file:
      - .env
    environment:
      - CONFIG_SERVER_HOSTNAME=config-service
      - CONFIG_SERVER_PORT=8888
      - CONFIG_SERVER_URL=http://config-service:8888
      - EUREKA_SERVER_HOSTNAME=eureka-service
      - EUREKA_SERVER_PORT=8761
      - EUREKA_SERVER=http://eureka-service:8761/eureka/
      - BILLING_SERVER_PORT=8085
      - BILLING_SERVER_HOSTNAME=billing-service
      - JDBC_BILLING_DATABASE_URL=jdbc:postgresql://postgres:5432/rolesync-micro-billing
      - DATABASE_PROVIDER_USERNAME=${DATABASE_PROVIDER_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      # Stripe credentials come from .env; never hardcode them here.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - rolesync-network
