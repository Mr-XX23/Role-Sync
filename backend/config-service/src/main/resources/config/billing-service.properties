# Server port
server.port=${BILLING_SERVER_PORT:8085}

# Database Configuration
spring.datasource.url=${JDBC_BILLING_DATABASE_URL}
spring.datasource.username=${DATABASE_PROVIDER_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DIALECT}
# Off: with open-in-view one persistence context spans the whole request, so a REQUIRES_NEW ledger
# write can reuse an account row loaded earlier in the request and fail its version check when a
# concurrent charge changed the balance in between. Each transaction must read the row fresh.
spring.jpa.open-in-view=false

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}
spring.datasource.hikari.pool-name=BillingServiceHikariPool

# Eureka configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${BILLING_SERVER_HOSTNAME:billing-service}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------------------------------------------------------------------------
# Stripe
# Test keys are fine for development: create them at dashboard.stripe.com in
# test mode. Keep the real values in backend/.env, never in this file.
# ---------------------------------------------------------------------------
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Where the buyer is returned after paying or abandoning checkout.
billing.success-url=${BILLING_SUCCESS_URL:${FRONTEND_URL:http://localhost:5173}/billing/success}
billing.cancel-url=${BILLING_CANCEL_URL:${FRONTEND_URL:http://localhost:5173}/pricing?checkout=cancelled}

# Service-to-service: the agent and data-pipeline check and charge credits with this token;
# super admin checks ask auth-service; membership checks ask workspace-service.
billing.internal-token=${INTERNAL_SERVICE_TOKEN:}
billing.auth-service-url=${AUTH_SERVICE_INTERNAL_URL:http://auth-service:8082}
billing.workspace-service-url=${WORKSPACE_SERVICE_URL:http://workspace-service:8083}

# ---------------------------------------------------------------------------
# Credit packages.
# price-minor is in the MINOR unit of the currency: 1000 = USD 10.00.
# These figures come from docs/billing/cost-model-and-credit-system.md, where a
# credit is priced at USD 0.01 with volume discounts down to USD 0.007.
# Change prices here; no deploy or Stripe dashboard edit needed.
# ---------------------------------------------------------------------------
billing.packages[0].code=STARTER
billing.packages[0].name=Starter
billing.packages[0].credits=1000
billing.packages[0].price-minor=1000
billing.packages[0].currency=usd
billing.packages[0].sort=1

billing.packages[1].code=GROWTH
billing.packages[1].name=Growth
billing.packages[1].credits=5000
billing.packages[1].price-minor=4500
billing.packages[1].currency=usd
billing.packages[1].sort=2

billing.packages[2].code=PRO
billing.packages[2].name=Pro
billing.packages[2].credits=20000
billing.packages[2].price-minor=16000
billing.packages[2].currency=usd
billing.packages[2].sort=3

billing.packages[3].code=BUSINESS
billing.packages[3].name=Business
billing.packages[3].credits=100000
billing.packages[3].price-minor=70000
billing.packages[3].currency=usd
billing.packages[3].sort=4

# ---------------------------------------------------------------------------
# Credits. See docs/billing/cost-model-and-credit-system.md.
# An operation costs ceil(provider cost x (1 + buffer) / (price x (1 - margin))),
# kept to a thousandth of a credit. With these values each credit is backed by at
# most USD 0.00174 of provider cost.
# ---------------------------------------------------------------------------
billing.credits.price-usd=${BILLING_CREDIT_PRICE_USD:0.01}
billing.credits.target-margin=${BILLING_TARGET_MARGIN:0.80}
billing.credits.buffer=${BILLING_COST_BUFFER:0.15}
billing.credits.signup-grant=${BILLING_SIGNUP_CREDITS:500}
billing.credits.low-balance-threshold=${BILLING_LOW_BALANCE_CREDITS:50}
billing.credits.max-admin-adjustment=1000000

# ---------------------------------------------------------------------------
# Provider rate card, USD per 1M tokens (verified September 2026).
# Free-tier models (":free", openrouter/free) are charged like gemini-2.5-flash-lite so
# credits stay consistent when those roles move to paid models.
# ---------------------------------------------------------------------------
billing.rates.default-model.input-per-million=0.30
billing.rates.default-model.output-per-million=2.50
billing.rates.default-model.cached-input-per-million=0.03

billing.rates.models[0].pattern=gemini-3.5-flash-lite
billing.rates.models[0].match=EXACT
billing.rates.models[0].input-per-million=0.30
billing.rates.models[0].output-per-million=2.50
billing.rates.models[0].cached-input-per-million=0.03

billing.rates.models[1].pattern=gemini-3.5-flash
billing.rates.models[1].match=EXACT
billing.rates.models[1].input-per-million=1.50
billing.rates.models[1].output-per-million=9.00
billing.rates.models[1].cached-input-per-million=0.15

billing.rates.models[2].pattern=gemini-3.6-flash
billing.rates.models[2].match=EXACT
billing.rates.models[2].input-per-million=0.75
billing.rates.models[2].output-per-million=3.75
billing.rates.models[2].cached-input-per-million=0.075

billing.rates.models[3].pattern=gemini-2.5-flash-lite
billing.rates.models[3].match=EXACT
billing.rates.models[3].input-per-million=0.10
billing.rates.models[3].output-per-million=0.40
billing.rates.models[3].cached-input-per-million=0.01

billing.rates.models[4].pattern=gemini-2.5-flash
billing.rates.models[4].match=EXACT
billing.rates.models[4].input-per-million=0.30
billing.rates.models[4].output-per-million=2.50
billing.rates.models[4].cached-input-per-million=0.03

billing.rates.models[5].pattern=gemini-embedding-2
billing.rates.models[5].match=EXACT
billing.rates.models[5].input-per-million=0.20
billing.rates.models[5].output-per-million=0
billing.rates.models[5].cached-input-per-million=0.20

billing.rates.models[6].pattern=gemini-embedding-001
billing.rates.models[6].match=EXACT
billing.rates.models[6].input-per-million=0.15
billing.rates.models[6].output-per-million=0
billing.rates.models[6].cached-input-per-million=0.15

billing.rates.models[7].pattern=openrouter/free
billing.rates.models[7].match=EXACT
billing.rates.models[7].input-per-million=0.10
billing.rates.models[7].output-per-million=0.40
billing.rates.models[7].cached-input-per-million=0.01

billing.rates.models[8].pattern=:free
billing.rates.models[8].match=SUFFIX
billing.rates.models[8].input-per-million=0.10
billing.rates.models[8].output-per-million=0.40
billing.rates.models[8].cached-input-per-million=0.01

# USD per unit.
billing.rates.units[0].unit=LLAMAPARSE_PAGE
billing.rates.units[0].usd=0.00375
billing.rates.units[1].unit=TAVILY_SEARCH
billing.rates.units[1].usd=0.008
billing.rates.units[2].unit=GROUNDED_PROMPT_25
billing.rates.units[2].usd=0.035
billing.rates.units[3].unit=GROUNDED_PROMPT_3X
billing.rates.units[3].usd=0.014
billing.rates.units[4].unit=COMPOSIO_EXECUTION
billing.rates.units[4].usd=0.004

