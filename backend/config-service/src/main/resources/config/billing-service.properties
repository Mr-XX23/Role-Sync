# Server port
server.port=${BILLING_SERVER_PORT:8085}

# Database Configuration
spring.datasource.url=${JDBC_BILLING_DATABASE_URL}
spring.datasource.username=${DATABASE_PROVIDER_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DIALECT}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}
spring.datasource.hikari.pool-name=BillingServiceHikariPool

# Eureka configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${BILLING_SERVER_HOSTNAME:billing-service}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------------------------------------------------------------------------
# Stripe
# Test keys are fine for development: create them at dashboard.stripe.com in
# test mode. Keep the real values in backend/.env, never in this file.
# ---------------------------------------------------------------------------
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Where the buyer is returned after paying or abandoning checkout.
billing.success-url=${BILLING_SUCCESS_URL:http://localhost:5173/billing/success}
billing.cancel-url=${BILLING_CANCEL_URL:http://localhost:5173/billing/cancel}

# ---------------------------------------------------------------------------
# Credit packages.
# price-minor is in the MINOR unit of the currency: 1000 = USD 10.00.
# These figures come from docs/billing/cost-model-and-credit-system.md, where a
# credit is priced at USD 0.01 with volume discounts down to USD 0.007.
# Change prices here; no deploy or Stripe dashboard edit needed.
# ---------------------------------------------------------------------------
billing.packages[0].code=STARTER
billing.packages[0].name=Starter
billing.packages[0].credits=1000
billing.packages[0].price-minor=1000
billing.packages[0].currency=usd
billing.packages[0].sort=1

billing.packages[1].code=GROWTH
billing.packages[1].name=Growth
billing.packages[1].credits=5000
billing.packages[1].price-minor=4500
billing.packages[1].currency=usd
billing.packages[1].sort=2

billing.packages[2].code=PRO
billing.packages[2].name=Pro
billing.packages[2].credits=20000
billing.packages[2].price-minor=16000
billing.packages[2].currency=usd
billing.packages[2].sort=3

billing.packages[3].code=BUSINESS
billing.packages[3].name=Business
billing.packages[3].credits=100000
billing.packages[3].price-minor=70000
billing.packages[3].currency=usd
billing.packages[3].sort=4
